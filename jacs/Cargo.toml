[package]
name = "jacs"
version = "0.12.0"
edition = "2024"
rust-version = "1.97"
resolver = "3"

include = [
    "src/**/*",
    "schemas/agent/v1/agent.schema.json",
    "schemas/header/v1/header.schema.json",
    "schemas/components/files/v1/files.schema.json",
    "schemas/components/signature/v1/signature.schema.json",
    "schemas/components/agreement/v1/agreement.schema.json",
    "schemas/agreement/v2/agreement.schema.json",
    "schemas/compatibility/ap2-mandate/v1/ap2-mandate.schema.json",
    "schemas/components/component/v1/component.schema.json",
    "jacs.config.schema.json",
    "examples/*.json",
    "examples/a2a_agent_example.rs",
    "examples/a2a_complete_example.rs",
    "examples/a2a_simple_example.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "LICENSE-APACHE",
    "THIRD-PARTY-NOTICES",
    "build.rs",
    "CHANGELOG.md",
    "basic-schemas.png",
    "benches/sign_and_check_sig.rs",
    "benches/agreement_benchmarks.rs",
    "benches/attestation_benchmarks.rs",
    "schemas/attestation/v1/attestation.schema.json",
]
description = "JACS JSON AI Communication Standard"
readme = "README.md"
authors = ["HAI.AI <engineering@hai.io>"]
license = "Apache-2.0"
homepage = "https://humanassisted.github.io/JACS"
repository = "https://github.com/HumanAssisted/JACS"
keywords = ["cryptography", "json", "ai", "data", "ml-ops"]
categories = ["cryptography", "text-processing", "data-structures" ]
build = "build.rs"


[dependencies]
base64 = "0.23.0"
chrono = "0.4.40"
jsonschema = { version = "0.49", features = ["resolve-http", "resolve-file"] }
log = "0.4.27"
pem = "4.0.0"
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signature = "3.0.0"
moka = { version = "0.12", features = ["sync"] }
url = "2.5.4"
sha2 = "0.11.0"
phf = { version = "0.13.1", features = ["macros"] }
strum = "0.28.0"
strum_macros = "0.28.0"
secrecy = "0.10.3"
aes-gcm = "0.11.1"
argon2 = "0.6.0"
regex = "1.11.1"
mime_guess = "2.0.5"
flate2 = "1.1.1"
encoding_rs = "0.8.35"
similar = "3.2"
rpassword = "7.3.1"
validator = "0.21.0"
uuid = { version = "1.16.0", features = ["v4", "v7", "js"] }
lazy_static = "1.5"
mail-parser = "0.11"
unicode-normalization = "0.1"
thiserror = "2"
dirs = "7.0"
env_logger = "0.11.8"
futures-util = "0.3.31"
referencing = "0.49.9"
futures-executor = "0.3.31"
# 0.1.7 floor: 0.1.6 pulled in unmaintained proc-macro-error2 (RUSTSEC-2026-0173)
getset = "0.1.7"
hex = "0.4"
html5ever = "0.39"
hickory-resolver = { version = "0.26.1", features = ["dnssec-ring"] }
hkdf = "0.13"
zeroize = "1.8"
pbkdf2 = { version = "0.12", features = ["simple"] }
serde_yaml_ng = "0.10"
jacs-media = { version = "0.12.0", path = "../jacs-media" }
jacs-core = { version = "0.12.0", path = "../jacs-core" }
tempfile = "3"


tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "logs", "metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls"], optional = true }
# 0.32.1 floor: <= 0.32.0 has unbounded memory allocation in W3C Baggage propagation (GHSA-w9wp-h8wv-79jx)
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "experimental_metrics_custom_reader"], optional = true }
opentelemetry-appender-tracing = { version = "0.32.0", optional = true }
tokio = { version = "1.0", features = ["rt-multi-thread"] }

# opentelemetry-prometheus = "0.29.1"

# libp2p = "0.55.0"
# [target.'cfg(target_os = "macos")'.dependencies]
# pqcrypto-mldsa = { version = "0.1", default-features = false, features = ["serialization"] }

# [target.'cfg(not(target_os = "macos"))'.dependencies]
# pqcrypto-mldsa = { version = "0.1", features = ["serialization"] }


[dev-dependencies]
jacs-binding-core = { path = "../binding-core" }
# Direct canonicalizer access used by jacs/tests/utils.rs +
# jacs/tests/security_hardening_tests.rs. After Task 005 moved the
# canonicalization runtime into jacs-core (no direct dep in jacs),
# these test files still need the raw helper for their fixture
# synthesizers — re-add as a dev-only dependency.
serde_json_canonicalizer = "0.3.2"
color-eyre = "0.6"
criterion = "0.8.2"
mdbook = "0.5.4"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.19.1"
serial_test = "4.0.1"
futures = "0.3"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["minio"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
proptest = "1.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"], optional = true }
# Feature-unify the existing WebAuthn backend for self-contained SDK artifacts.
# This is not a second cryptographic backend or a core default dependency.
openssl = { version = "0.10.81", default-features = false, optional = true }
ring = "0.17.9"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }
walkdir = "2.5.0"
object_store = { version ="0.14.1", default-features = false, features = ["fs"] }
# Post-quantum 2025 standards (ML-DSA and ML-KEM)
fips203 = "0.4.3"
fips204 = "0.4.6"
# ES256 (ECDSA P-256) ecosystem compatibility keys (P2 Task 002). Narrow
# RustCrypto stack per the PRD buy/build note: never used for native JACS
# signing, and `ring` stays out of portable core paths.
p256 = { version = "0.14", features = ["pkcs8", "pem"] }
# base58btc for Multikey (publicKeyMultibase) encoding of the ES256 key —
# already in the tree transitively.
bs58 = "0.5"
# rand_core 0.6 (with OsRng) for p256 keygen — the workspace `rand` is 0.9,
# whose rng traits p256 0.13 does not accept.
rand_core = { version = "0.6", features = ["getrandom"] }
# SQLite storage via sqlx (optional). PostgreSQL has been extracted to jacs-postgresql.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls"], optional = true }
# rusqlite (sync SQLite bindings, optional -- lightweight alternative to sqlx SQLite)
# Kept aligned with sqlx's libsqlite3-sys to avoid links conflicts.
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }
# SurrealDB storage has been extracted to the `jacs-surrealdb` crate.
# DuckDB storage has been extracted to the `jacs-duckdb` crate.
# Redb storage has been extracted to the `jacs-redb` crate.

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", optional = true, features = ["sync-secret-service"] }

# Fallback for other platforms (Windows, etc.) — no platform-specific backend
[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
keyring = { version = "3.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[features]
default = ["sqlite"]

# Native-only mapped human approval; portable core evidence remains dependency-free.
human-approval = ["dep:webauthn-rs"]
# Native distribution profile: compile the same locked OpenSSL into the artifact.
human-approval-vendored = ["human-approval", "dep:openssl", "openssl/vendored"]

# Lightweight sync SQLite backend (rusqlite, no tokio needed) — the default.
sqlite = ["dep:rusqlite"]

# Async SQLite backend via sqlx (requires tokio runtime).
sqlx-sqlite = ["dep:sqlx", "sqlx/sqlite"]

# PostgreSQL storage backend has been extracted to the `jacs-postgresql` crate.
# SurrealDB storage backend has been extracted to the `jacs-surrealdb` crate.
# DuckDB storage backend has been extracted to the `jacs-duckdb` crate.
# Redb storage backend has been extracted to the `jacs-redb` crate.

# A2A protocol (zero new deps)
a2a = []

# Agreements (zero new deps)
agreements = []

# Attestation (zero new deps)
attestation = []

# Conflict documents (zero new deps)
conflict = []

# Post-quantum algorithm tests (slow keygen). Omit for fast test runs.
pq-tests = []

# AWS S3 storage is opt-in so the default signing library does not ship cloud
# XML parsers or TLS stacks that it does not use.
s3 = ["object_store/aws"]

# S3 conformance tests (require Docker/MinIO). Omit for fast test runs.
s3-tests = ["s3"]

# OS keychain integration for password storage (macOS Keychain, Linux Secret Service)
keychain = ["dep:keyring"]

# OS keychain integration tests (require real keychain access). Omit for CI.
keychain-tests = ["keychain"]

# Observability backends are gated behind compile-time features.
# Default is a minimal core: stderr/file logs only, no remote backends.
# Enable these features to activate OTLP-based backends and pull in deps.
otlp-logs = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-appender-tracing",
]
otlp-metrics = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
]
otlp-tracing = [
  "dep:opentelemetry",
  "dep:opentelemetry-otlp",
  "dep:opentelemetry_sdk",
  "dep:tracing-opentelemetry",
]

[[bench]]
name = "sign_and_check_sig"
harness = false

[[bench]]
name = "agreement_benchmarks"
harness = false

[[bench]]
name = "attestation_benchmarks"
harness = false
required-features = ["attestation"]

[[example]]
name = "a2a_agent_example"
required-features = ["a2a"]

[[example]]
name = "a2a_complete_example"
required-features = ["a2a"]

[[example]]
name = "a2a_simple_example"
required-features = ["a2a"]

[package.metadata.dev-requirements]
cargo-audit = "0.22.1"
