[package]
name = "jacs-binding-core"
version = "0.11.4"
edition = "2024"
rust-version = "1.97"
resolver = "3"
description = "Shared core logic for JACS language bindings (Python, Node.js, etc.)"
readme = "../README.md"
authors = ["JACS Contributors"]
license = "Apache-2.0"
repository = "https://github.com/HumanAssisted/JACS"
homepage = "https://humanassisted.github.io/JACS"

[features]
default = []
a2a = ["jacs/a2a"]
agreements = ["jacs/agreements"]
attestation = ["jacs/attestation"]
human-approval = ["jacs/human-approval"]
# Post-quantum algorithm tests (slow keygen). Omit for fast test runs.
pq-tests = []

[dependencies]
jacs = { version = "0.11.4", path = "../jacs" }
jacs-core = { version = "0.11.4", path = "../jacs-core" }
serde_json = "1.0"
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
rand = "0.9"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls"] }

[dev-dependencies]
tempfile = "3"
base64 = "0.22.1"
serial_test = "3"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }

[[example]]
name = "generate_human_approval_fixture"
required-features = ["human-approval"]
