[package]
name = "jacs-core"
version = "0.13.0"
edition = "2024"
rust-version = "1.97"
resolver = "3"
description = "JACS portable protocol layer (no I/O, no native deps)"
readme = "README.md"
authors = ["HAI.AI <engineering@hai.io>"]
license = "Apache-2.0"
homepage = "https://humanassisted.github.io/JACS"
repository = "https://github.com/HumanAssisted/JACS"
keywords = ["cryptography", "json", "wasm", "portable", "protocol"]
categories = ["cryptography", "no-std::no-alloc", "wasm"]

# Ship the embedded JACS schema set with the crate so wasm builds resolve
# every $ref offline. Mirrors jacs/Cargo.toml's `include = [...]` list.
include = [
    "src/**/*",
    "schemas/agent/v1/agent.schema.json",
    "schemas/header/v1/header.schema.json",
    "schemas/components/files/v1/files.schema.json",
    "schemas/components/signature/v1/signature.schema.json",
    "schemas/components/agreement/v1/agreement.schema.json",
    "schemas/agreement/v2/agreement.schema.json",
    "schemas/agreement/v3/agreement.schema.json",
    "schemas/attestation/v1/attestation.schema.json",
    "schemas/conflict/v1/conflict.schema.json",
    "schemas/compatibility-key-binding/v1/compatibility-key-binding.schema.json",
    "schemas/a2a-verification-result.schema.json",
    "schemas/jacs.config.schema.json",
    "LICENSE-APACHE",
    "THIRD-PARTY-NOTICES",
    "Cargo.toml",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_json_canonicalizer = "0.3.2"
thiserror = "2"
# Embedded $ref resolution for jsonschema. `default-features = false` keeps
# `resolve-http` and `resolve-file` (both native-only) out of the wasm tree.
jsonschema = { version = "0.56", default-features = false }
phf = { version = "0.13.1", features = ["macros"] }
# Encrypted private-key envelope (V2 Argon2id + legacy PBKDF2 — both
# pure-Rust and wasm-friendly per WASM_FINDINGS). See PRD §4.6.
aes-gcm = "0.11.1"
argon2 = "0.6"
pbkdf2 = "0.13"
sha2 = "0.11.0"
rand = "0.10"
zeroize = "1.8"
base64 = "0.23"
hex = "0.4"
# Exact compatibility with legacy native public-key hashing (pure Rust).
encoding_rs = "0.8.35"
# Same pure-Rust HTTP target normalization as native request-auth-v2.
url = "2"
# Post-quantum signatures (ML-DSA-87 / Dilithium). Pure-Rust, wasm-friendly.
# See PRD §4.2, §4.7.
fips204 = "0.4.6"
# Ed25519. Replaces `ring` in the protocol layer so jacs-core compiles for
# wasm32. `pkcs8` reads the v1 + v2 PKCS#8 byte formats that the native
# `ring` path emits; `zeroize` wipes the private key on drop. Key generation
# fills a zeroizing seed buffer with rand 0.10's fallible SysRng. See PRD §4.5.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "pkcs8", "zeroize", "rand_core"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
# `SecretBox` for `UnlockSecret::RawPrivateKey`. Pure-Rust, wasm-friendly,
# already a transitive dep of native jacs. See PRD §4.2.
secrecy = "0.10.3"
# Stable identifiers — UUID v4 for ephemeral agent IDs, UUID v7 for
# signature jti. The `js` feature is required on wasm32 so uuid uses
# `getrandom`'s browser RNG path instead of `/dev/urandom`.
uuid = { version = "1", features = ["v4", "v7", "js"] }
# RFC3339 timestamps for `jacsSignature.date`. `default-features = false`
# strips `clock` (native time), but we re-enable it on every target with
# the `now` feature (the WASM build pulls Date.now via `wasmbind`).
chrono = { version = "0.4", default-features = false, features = ["std", "now", "serde", "wasmbind"] }

[dev-dependencies]
serde_json = "1.0"
# For the envelope tests' legacy-fixture synthesizer and the CoreAgent
# raw-key unlock helper.
aes-gcm = "0.11.1"
base64 = "0.23"
rand = "0.10"
secrecy = "0.10.3"

# Browser RNG wiring for rand / RustCrypto (0.4), jsonschema's transitive
# dependencies (0.3), and the FIPS implementations (0.2).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
