[workspace]
# This workspace contains the portable primitive and its thin platform boundaries.
members = ["jacs-core", "jacs-wasm", "jacs-mobile", "jacs-mcp", "jacs-cli"]
default-members = ["jacs-core", "jacs-wasm", "jacs-mobile", "jacs-mcp", "jacs-cli"]
# Historical native integrations have their own manifest, lock and license.
exclude = ["archive/native"]
resolver = "3"

[workspace.package]
rust-version = "1.97"
readme = "README.md"
authors = ["HAI.AI <engineering@hai.io>"]
license = "Apache-2.0"
homepage = "https://humanassisted.github.io/JACS"
repository = "https://github.com/HumanAssisted/JACS"
keywords = ["cryptography", "json", "ai", "data", "ml-ops"]
categories = ["cryptography", "text-processing", "data-structures"]

[workspace.metadata.dev-requirements]
cargo-audit = "0.22.1"

# Upstream's unreleased replacement for the unmaintained basic-toml parser.
# Remove this source-build patch when the Askama fix is published to crates.io.
# Workspace patches do not propagate to published crates or their consumers.
[patch.crates-io]
askama_derive = { git = "https://github.com/askama-rs/askama", rev = "3863808cf594054f7644979ed92caaafc878f378" }
