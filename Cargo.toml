[workspace]
# Only the portable primitive and its thin platform/front-end boundaries ship.
members = ["jacs-core", "jacs-wasm", "jacs-mobile", "jacs-mcp", "jacs-cli"]
default-members = ["jacs-core", "jacs-wasm", "jacs-mobile", "jacs-mcp", "jacs-cli"]
# Historical native integrations have their own manifest, lock and license.
exclude = ["archive/native"]
resolver = "3"

[workspace.package]
rust-version = "1.97"
readme = "README.md"
authors = ["HAI.AI <engineering@hai.io>"]
license = "Apache-2.0"
homepage = "https://humanassisted.github.io/JACS"
repository = "https://github.com/HumanAssisted/JACS"
keywords = ["cryptography", "json", "ai", "data", "ml-ops"]
categories = ["cryptography", "text-processing", "data-structures"]

[workspace.metadata.dev-requirements]
cargo-audit = "0.22.1"
