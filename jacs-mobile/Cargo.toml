[package]
name = "jacs-mobile"
version = "0.16.1"
edition = "2024"
rust-version = "1.97"
description = "JACS portable UniFFI bindings for Android, iOS and React Native"
publish = true
license = "Apache-2.0"
repository = "https://github.com/HumanAssisted/JACS"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
jacs-core = { version = "0.16.1", path = "../jacs-core" }
# Runtime scaffolding only. UniFFI's default `cargo-metadata` feature names the
# binding generator as a weak optional dependency, which Cargo then locks.
# The generator lives in the unpublished tools/jacs-mobile-bindgen crate.
uniffi = { version = "=0.32.2", default-features = false }
serde_json = "1"
thiserror = "2"
zeroize = "1.8"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
base64 = "0.23"
