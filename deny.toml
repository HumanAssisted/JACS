# cargo-deny configuration for JACS
# Run: cargo deny check
# CI: cargo deny check licenses

[graph]
all-features = false

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

# In cargo-deny v0.19+, any license not in `allow` is denied by default.
# The allow-list above is sufficient to block GPL/AGPL/LGPL/SSPL/EUPL.

# The portable graph has no custom license clarifications or proprietary exceptions.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []
