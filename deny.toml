# cargo-deny configuration for JACS
# Run: cargo deny check
# CI: cargo deny check licenses

[graph]
all-features = false

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "MIT-0",
    "0BSD",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

# In cargo-deny v0.19+, any license not in `allow` is denied by default.
# The allow-list above is sufficient to block GPL/AGPL/LGPL/SSPL/EUPL.

# The portable graph has no custom license clarifications or proprietary exceptions.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# The only permitted portable-graph ignore. Each entry MUST carry a reason,
# owner and review deadline, recorded in archive/native/SECURITY_AUDIT.md;
# scripts/check-security-exceptions.py enforces the ID, the deadline and the
# exact parent set.
ignore = [
    # chrono is unmaintained (informational, no patched version, no reported
    # vulnerability). Its only parents here are jacs-core's public deadline and
    # evidence APIs, rmcp (which requires chrono on every target, including
    # 3.11.0) and schemars' chrono04 feature, which rmcp enables. Remove when
    # rmcp drops chrono (modelcontextprotocol/rust-sdk#1469) and jacs-core's
    # public API moves to `time`.
    # Owner: JACS maintainers. Reviewed 2026-11-26 in SECURITY_AUDIT.md.
    # Review by: 2026-12-26.
    "RUSTSEC-2026-0543",
]
