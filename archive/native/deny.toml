[advisories]
# Use the RustSec advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]

# Each ignore here MUST carry a reason, owner, and review deadline. Re-evaluate
# whenever the named upstream releases and no later than the recorded date.
ignore = [
    # rsa 0.9.10 is present only in the standalone SurrealDB lock through
    # jsonwebtoken's WASM target feature, not the native backend. The JACS
    # adapter exposes no JWT auth or RSA private-key operations. The fixed
    # rsa 0.10 needs jsonwebtoken 12, but SurrealDB 4.0.1 (latest) requires
    # jsonwebtoken ^10.4.0, whose releases require rsa ^0.9.6.
    # Owner: JACS storage maintainers. Reviewed 2026-11-26 in SECURITY_AUDIT.md.
    # Review by: 2026-12-26.
    "RUSTSEC-2023-0071",
    # bincode 2.0.1 is unmaintained in SurrealDB's surrealmx graph; no
    # exploitable flaw is reported and JACS has no direct bincode use.
    # Owner: JACS storage maintainers. Reviewed 2026-11-26 in SECURITY_AUDIT.md.
    # Review by: 2026-12-26.
    "RUSTSEC-2025-0141",
    # humantime is unmaintained (informational, no patched version). It is
    # reached through object_store in every archived lock and also through
    # surrealdb-rpc in the SurrealDB adapter; never in the portable graph.
    # Owner: JACS storage maintainers. Reviewed 2026-11-26 in SECURITY_AUDIT.md.
    # Review by: 2026-12-26.
    "RUSTSEC-2026-0542",
    # chrono is unmaintained (informational, no patched version). The same
    # dated disposition as the portable deny.toml; here SurrealDB, object_store
    # and the native jacs crates also depend on it.
    # Owner: JACS maintainers. Reviewed 2026-11-26 in SECURITY_AUDIT.md.
    # Review by: 2026-12-26.
    "RUSTSEC-2026-0543",
]
