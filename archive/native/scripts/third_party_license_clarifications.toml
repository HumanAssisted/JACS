# Reviewed source contract for every cargo-deny [[licenses.clarify]] entry.
# cargo-deny-hash is XXH32 over cargo-deny's normalized text. SHA-256 covers
# the exact upstream bytes embedded by scripts/third_party_notices.py.

[[reviewed]]
names = ["ring"]
expression = "(Apache-2.0 OR ISC) AND OpenSSL"
path = "LICENSE"
