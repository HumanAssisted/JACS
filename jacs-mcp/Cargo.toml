[package]
name = "jacs-mcp"
version = "0.13.0"
edition = "2024"
rust-version = "1.97"
description = "Local MCP signing and verification with the portable JACS core"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/HumanAssisted/JACS"

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:tokio", "dep:tracing-subscriber"]

[dependencies]
jacs-core = { version = "0.13.0", path = "../jacs-core" }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1.8"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"], optional = true }
rmcp = { version = "3.3.0", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync"] }

[[example]]
name = "print_contract"
required-features = ["mcp"]
