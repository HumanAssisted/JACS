[package]
name = "jacs-cli"
version = "0.15.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Thin JACS command line for portable signatures and encrypted agent keys"
readme = "README.md"

[lib]
name = "jacs_cli"
path = "src/lib.rs"

[[bin]]
name = "jacs"
path = "src/main.rs"

[dependencies]
jacs-core = { version = "0.15.0", path = "../jacs-core" }
jacs-mcp = { version = "0.15.0", path = "../jacs-mcp" }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.23"
rpassword = "7.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "io-std", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
