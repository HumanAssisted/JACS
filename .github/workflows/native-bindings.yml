name: Native binding candidates

on:
  pull_request:
    paths:
      - "archive/native/**"
      - "jacsgo/**"
      - "jacs-core/**"
      - "scripts/native_bindings*"
      - "scripts/smoke/verify_human_approval*"
      - "scripts/check_native_crypto_linkage.py"
      - "scripts/check_python_package_inventory.py"
      - ".github/workflows/native-bindings.yml"
      - ".github/workflows/release-npm.yml"
      - ".github/workflows/release-pypi.yml"
      - ".github/workflows/release-jacsgo.yml"
  push:
    branches: [main]
    paths:
      - "archive/native/**"
      - "jacsgo/**"
      - "jacs-core/**"
      - "scripts/native_bindings*"
      - "scripts/smoke/verify_human_approval*"
      - "scripts/check_native_crypto_linkage.py"
      - "scripts/check_python_package_inventory.py"
      - ".github/workflows/native-bindings.yml"
      - ".github/workflows/release-npm.yml"
      - ".github/workflows/release-pypi.yml"
      - ".github/workflows/release-jacsgo.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-bindings-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidates:
    name: Installed Node, Python and Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.97.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache-dependency-path: archive/native/jacsgo/go.sum
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: archive/native -> ../../target/native-bindings/cargo
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install pinned build tooling
        run: |
          npm install --global npm@11.18.0
          python -m pip install maturin==1.5.0
          cargo install cargo-audit --locked --version 0.22.1
      - name: Audit the native Rust dependency closure
        run: cargo audit --file archive/native/Cargo.lock
      - name: Audit locked native npm dependencies
        working-directory: archive/native/jacsnpm
        run: npm audit --package-lock-only --audit-level=high
      - name: Check native dependency notices and Go distribution copies
        run: python3 scripts/native_bindings_notices.py --check
      - name: Build and verify installed candidates sequentially
        run: bash scripts/native_bindings.sh verify all
      - name: Audit the public Go module with the exact native candidate
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          mkdir -p jacsgo/build
          if [ "$(go env GOOS)" = darwin ]; then extension=dylib; else extension=so; fi
          cp target/native-bindings/artifacts/go/artifacts/*."$extension" "jacsgo/build/libjacsgo.$extension"
          cd jacsgo
          govulncheck ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-binding-candidates-${{ matrix.os }}
          path: target/native-bindings/artifacts
          if-no-files-found: error

  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned audit tools
        run: python -m pip install "pip-audit==2.9.0" "uv==0.11.28"
      - name: Audit core and each optional extra
        working-directory: archive/native/jacspy
        run: |
          set -euo pipefail
          extras=(core mcp ws langchain langgraph fastapi anthropic a2a a2a-server all)
          for extra in "${extras[@]}"; do
            requirements="/tmp/jacs-${extra}.txt"
            if [ "$extra" = core ]; then
              uv export --locked --no-dev --no-emit-project --no-hashes --output-file "$requirements" >/dev/null
            else
              uv export --locked --no-dev --no-emit-project --no-hashes --extra "$extra" --output-file "$requirements" >/dev/null
            fi
            pip-audit --requirement "$requirements"
          done
      - name: Audit standalone Python MCP example lock
        working-directory: archive/native/jacspy/examples/jacs-mcp
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --output-file /tmp/jacs-mcp-example.txt >/dev/null
          pip-audit --disable-pip --no-deps --requirement /tmp/jacs-mcp-example.txt
      - name: Audit standalone Python requirements examples
        working-directory: archive/native/jacspy
        run: |
          set -euo pipefail
          for requirements in \
            examples/http/requirements.txt \
            examples/mcp/requirements.txt \
            examples/langchain/requirements.txt
          do
            pip-audit --requirement "$requirements"
          done
      - name: Generate Python CycloneDX SBOM
        working-directory: archive/native/jacspy
        run: |
          uv export --locked --all-extras --format cyclonedx1.5 --output-file /tmp/jacspy.cdx.json >/dev/null
          python -c 'import json; s=json.load(open("/tmp/jacspy.cdx.json", encoding="utf-8")); assert s.get("bomFormat") == "CycloneDX" and s.get("components"), "Python CycloneDX SBOM is empty or malformed"'
