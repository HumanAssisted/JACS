name: Portable Rust validation

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  portable:
    name: Portable primitive and thin fronts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: Enforce the five-crate primitive boundary
        run: python3 scripts/check_workspace_boundary.py
      - name: Compile all active features with warnings denied
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --locked --workspace --all-features
      - name: Core, mobile, CLI and MCP behavior (including PQ)
        run: cargo test --locked --workspace
      - name: Build and smoke the public CLI
        run: |
          cargo build --locked -p jacs-cli
          python3 scripts/smoke-portable-cli.py --binary target/debug/jacs

  archive-compatibility:
    name: Native SDK compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Release candidate verification denies warnings; catch native ones here
      # first (a deprecated rmcp alias failed crate/v0.16.0 only at publish).
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - name: Validate the native SDK boundary
        run: cargo check --locked --manifest-path archive/native/Cargo.toml -p jacs -p jacs-binding-core --no-default-features
      - name: Verify current WebAuthn ceremonies and archived approval receipts
        run: |
          cargo test --locked --manifest-path archive/native/Cargo.toml -p jacs --no-default-features --features human-approval --lib human_approval::
          cargo test --locked --manifest-path archive/native/Cargo.toml -p jacs-binding-core --features human-approval --test human_approval
      - name: Compile the native Criterion benchmarks
        run: cargo check --locked --manifest-path archive/native/Cargo.toml -p jacs --no-default-features --features agreements,attestation --benches
      - name: Compile the standalone observability example against its own lock
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/archive/native/target
        run: cargo check --locked --manifest-path archive/native/jacs/examples/observability/Cargo.toml
      - name: Build the compatibility CLI for process-level regression tests
        run: cargo build --locked --manifest-path archive/native/Cargo.toml -p jacs-cli-compat --no-default-features --features mcp,agreements
      - name: Preserve upstream MCP redaction and advisory visibility
        run: cargo test --locked --manifest-path archive/native/Cargo.toml -p jacs-mcp-compat --features full-tools --test stdio_protocol --test visibility_meta
      - name: Preserve the isolated MCP-to-MIME verification flow
        run: cargo test --locked --manifest-path archive/native/Cargo.toml -p jacs-cli-compat --no-default-features --features mcp,agreements --test mcp_mime_demo
      - name: Preserve native discovery, DNS and protocol verification boundaries
        run: |
          umask 022
          for filter in key_resolution w3c 'a2a::' 'dns::bootstrap' 'agent::loaders' 'attestation::verify' 'trust::tests::enrolled_' 'signer::tests::' secure_fetch; do
            cargo test --locked --manifest-path archive/native/Cargo.toml -p jacs --no-default-features --features a2a,attestation,pq-tests --lib "$filter"
          done
      - name: Preserve native resolver consumers and signed media compatibility
        run: |
          # The explicit unsafe-backup fixtures expect the ordinary process umask.
          umask 022
          cargo test --locked --manifest-path archive/native/Cargo.toml -p jacs --no-default-features --features a2a,attestation,pq-tests --test key_resolution_consumers --test dns_tests --test dns_policy_tests --test w3c_fixtures --test a2a_identity_binding --test a2a_v1_peer --test inline_text_tests --test image_signature_tests --test legacy_verify_guardrails --test pq2025_tests --test security_hardening_tests --test schema_security_tests --test schema_reexport

  surrealdb-adapter:
    name: SurrealDB 4 in-memory storage and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: archive/native/jacs-surrealdb
      - name: Exercise the embedded adapter and JACS storage contract
        env:
          # SurrealDB 4.0.1's unoptimized query executor needs the upstream debug-test stack.
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked --manifest-path archive/native/jacs-surrealdb/Cargo.toml --tests

  dependency-backports:
    name: SurrealDB dependency backport regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: |
            archive/native/jacs-surrealdb/vendor/jsonwebtoken
            archive/native/jacs-surrealdb/vendor/object_store
            archive/native/jacs-surrealdb/vendor/wasmtimer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install wasm-pack for actual WASM timer regressions
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.12.1'
      - name: Preserve timer behavior and pinned futures in WebAssembly
        working-directory: archive/native/jacs-surrealdb/vendor/wasmtimer
        run: wasm-pack test --node . --locked --all-features --test web --test backport_pin
      - name: Check the timer with the adapter's exact WASM dependency graph
        run: cargo check --locked --manifest-path archive/native/jacs-surrealdb/Cargo.toml --target wasm32-unknown-unknown -p wasmtimer
      - name: Preserve JWT ECDSA behavior with RustCrypto
        run: |
          cargo test --locked --manifest-path archive/native/jacs-surrealdb/vendor/jsonwebtoken/Cargo.toml --no-default-features --features rust_crypto,use_pem --test lib ecdsa::
          cargo test --locked --manifest-path archive/native/jacs-surrealdb/vendor/jsonwebtoken/Cargo.toml --no-default-features --features rust_crypto,use_pem --test backport_ecdsa
      - name: Preserve JWT ECDSA behavior with AWS-LC
        run: |
          cargo test --locked --manifest-path archive/native/jacs-surrealdb/vendor/jsonwebtoken/Cargo.toml --no-default-features --features aws_lc_rs,use_pem --test lib ecdsa::
          cargo test --locked --manifest-path archive/native/jacs-surrealdb/vendor/jsonwebtoken/Cargo.toml --no-default-features --features aws_lc_rs,use_pem --test backport_ecdsa
      - name: Compile JWT RustCrypto for WebAssembly
        run: cargo check --locked --manifest-path archive/native/jacs-surrealdb/vendor/jsonwebtoken/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features rust_crypto --lib
      - name: Preserve object-store XML parsing and serialization
        run: |
          cargo test --locked --manifest-path archive/native/jacs-surrealdb/vendor/object_store/Cargo.toml --all-features --lib deserde_
          cargo test --locked --manifest-path archive/native/jacs-surrealdb/vendor/object_store/Cargo.toml --all-features --lib to_xml
          cargo test --locked --manifest-path archive/native/jacs-surrealdb/vendor/object_store/Cargo.toml --all-features --lib test_delegated_key_response
