name: Mobile binding validation

on:
  pull_request:
    paths:
      - "jacs-core/**"
      - "jacs-mobile/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/mobile-bindings.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-bindings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  android-source:
    name: Android source tests and native AAR assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Portable mobile integration tests
        run: cargo test -p jacs-mobile --test portable -- --nocapture
      - name: Generate Kotlin and Swift from the current Rust API
        run: bash jacs-mobile/scripts/generate-bindings.sh
      - name: Release PQ operations on 512 KiB and 1 MiB native stacks
        run: cargo test -p jacs-mobile --release --locked --test native_stack
      - name: Compile Android adapter and verify DER interoperability
        shell: bash
        run: |
          java -version
          sdk_jar="${ANDROID_HOME:-}/platforms/android-35/android.jar"
          if [[ -f "$sdk_jar" ]]; then
            python3 jacs-mobile/scripts/check-android-source.py --api-jar "$sdk_jar"
          else
            python3 jacs-mobile/scripts/check-android-source.py
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-compiled-source
          path: jacs-mobile/generated/android-typecheck.jar
          if-no-files-found: error
      - name: Prepare pinned Android package build tools
        run: bash jacs-mobile/scripts/prepare-android-ci.sh
      - name: Assemble Android AAR and local Maven bundle
        run: bash jacs-mobile/scripts/build-android-aar.sh --reuse-bindings
      - name: Run Android Keystore instrumentation on API 35
        run: bash jacs-mobile/scripts/run-android-instrumented.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-instrumentation-results
          path: |
            jacs-mobile/generated/android-emulator.log
            jacs-mobile/generated/android-project/library/build/reports/androidTests/
            jacs-mobile/generated/android-project/library/build/outputs/apk/androidTest/debug/library-debug-androidTest.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacs-mobile-android-package
          path: |
            jacs-mobile/generated/android-project/library/build/outputs/aar/library-release.aar
            jacs-mobile/generated/android-project/library/build/maven/
          if-no-files-found: error

  ios-source:
    name: iOS source tests and native XCFramework assembly
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Generate Swift from the current Rust API
        run: bash jacs-mobile/scripts/generate-bindings.sh
      - name: Compile generated Swift and native security adapters
        run: bash jacs-mobile/scripts/check-ios-source.sh
      - name: Assemble iOS XCFramework and Swift package
        run: bash jacs-mobile/scripts/build-ios-xcframework.sh --reuse-bindings
      - name: Run biometric lifecycle and Keychain tests in the iOS simulator
        run: bash jacs-mobile/scripts/check-ios-tests.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacs-mobile-ios-package
          path: |
            jacs-mobile/generated/ios-package/Package.swift
            jacs-mobile/generated/ios-package/Sources/
            jacs-mobile/generated/ios-package/Tests/
            jacs-mobile/generated/ios-package/JacsMobileFFI.xcframework/
          if-no-files-found: error
