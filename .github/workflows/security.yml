name: Release security gates

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-09
        with:
          toolchain: "1.97"

      - name: Check immutable workflow dependencies
        run: ./scripts/check-action-pins.sh

      - name: Check advisory exception deadlines and reachability
        run: ./scripts/check-security-exceptions.py

      - name: Check source and shipped-artifact matrix
        run: ./scripts/check-release-matrix.py

      - name: Check project license consistency
        run: python3 scripts/check_project_license.py

      - name: Check THIRD-PARTY-NOTICES freshness
        run: python3 scripts/third_party_notices.py --check

      - name: Set up Node for the schema-generation regression
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install pinned schema documentation generator
        run: npm install --global --ignore-scripts @adobe/jsonschema2md@8.0.2

      - name: Test release and security policy contracts
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install pinned Rust audit tools
        run: |
          cargo install cargo-audit --locked --version 0.22.1
          cargo install cargo-deny --locked --version 0.19.0

      - name: Audit workspace lock
        run: |
          cargo audit
          cargo deny --all-features check advisories
          cargo deny --all-features check licenses

      - name: Audit archived native lock
        run: cargo audit --file archive/native/Cargo.lock

      - name: Audit separate SurrealDB lock
        run: |
          cargo audit --file archive/native/jacs-surrealdb/Cargo.lock \
            --ignore RUSTSEC-2023-0071
          cargo deny --manifest-path archive/native/jacs-surrealdb/Cargo.toml --config archive/native/deny.toml --all-features check advisories licenses

      - name: Audit standalone observability example lock
        run: |
          cargo audit --file archive/native/jacs/examples/observability/Cargo.lock
          cargo deny --manifest-path archive/native/jacs/examples/observability/Cargo.toml --config archive/native/deny.toml --all-features check advisories licenses

      - name: Pinned full-history secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner \
            --gitleaks-ignore-path .gitleaksignore .

  browser-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Audit browser package consumer lock
        working-directory: jacs-wasm/examples/vite-smoke
        run: npm audit --package-lock-only --audit-level=high
