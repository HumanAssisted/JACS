name: Node.js (jacsnpm)

on:
  workflow_call:
  push:
    branches: ["main"]
    paths:
      - 'jacsnpm/**'
      - 'jacs/**'  # jacsnpm depends on jacs
      - 'jacs-core/**'
      - 'jacs-media/**'
      - 'binding-core/**'  # jacsnpm verifyStandalone depends on binding-core
      - '.github/workflows/nodejs.yml'
      - '.github/workflows/release-npm.yml'
      - 'Cargo.lock'
      - 'scripts/check_native_crypto_linkage.py'
      - 'scripts/smoke/verify_human_approval.cjs'
  pull_request:
    branches: ["main"]
    paths:
      - 'jacsnpm/**'
      - 'jacs/**'  # jacsnpm depends on jacs
      - 'jacs-core/**'
      - 'jacs-media/**'
      - 'binding-core/**'  # jacsnpm verifyStandalone depends on binding-core
      - '.github/workflows/nodejs.yml'
      - '.github/workflows/release-npm.yml'
      - 'Cargo.lock'
      - 'scripts/check_native_crypto_linkage.py'
      - 'scripts/smoke/verify_human_approval.cjs'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: node-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-jacsnpm:
    name: Test jacsnpm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20']

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-09
        with:
          toolchain: "1.97"

      - name: Install libdbus (required by keyring crate on Linux)
        run: sudo apt-get update || echo 'apt-get update reported index errors (third-party runner sources); installing from the indexes that loaded'; sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: jacsnpm/package-lock.json

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install dependencies
        working-directory: jacsnpm
        run: npm ci --ignore-scripts

      - name: Run npm audit
        working-directory: jacsnpm
        run: npm audit --audit-level=high

      - name: Build native module
        working-directory: jacsnpm
        run: npm run build

      - name: Pre-build jacs-cli (cross-language tests shell out to cargo)
        run: cargo build -p jacs-cli --quiet

      - name: Run cross-language tests (hermetic env)
        working-directory: jacsnpm
        env:
          JACS_DATA_DIRECTORY: /tmp/does-not-exist
          JACS_KEY_DIRECTORY: /tmp/does-not-exist
          JACS_DEFAULT_STORAGE: memory
          JACS_KEY_RESOLUTION: local
        run: npm run test:cross-language

      - name: Run tests (parallel, excluding cross-language already covered above)
        working-directory: jacsnpm
        env:
          JACS_TEST_HUMAN_APPROVAL: "1"
        run: npm run test:ci

      - name: Run parity tests (binding contract conformance)
        working-directory: jacsnpm
        run: node --test tests/test_parity.js

      - name: Smoke test quickstart example
        working-directory: jacsnpm
        env:
          JACS_PRIVATE_KEY_PASSWORD: TestP@ss123!#
        run: |
          set -euo pipefail
          TMP_EXAMPLE_DIR=$(mktemp -d)
          cd "${TMP_EXAMPLE_DIR}"
          node "${GITHUB_WORKSPACE}/jacsnpm/examples/quickstart.js"

      - name: Smoke test packed npm install
        working-directory: jacsnpm
        run: |
          set -euo pipefail
          PACKAGE_TGZ=$(npm pack | tail -n 1)
          mkdir -p /tmp/jacs-npm-smoke
          cd /tmp/jacs-npm-smoke
          npm init -y >/dev/null
          npm install "${GITHUB_WORKSPACE}/jacsnpm/${PACKAGE_TGZ}" --ignore-scripts
          test -f node_modules/@hai.ai/jacs/bin/jacs-cli.js
          test ! -e node_modules/@hai.ai/jacs/bin/jacs-cli
          test ! -e node_modules/@hai.ai/jacs/bin/jacs-cli.exe
          ls node_modules/@hai.ai/jacs/package.json && echo "smoke install ok"
          node "${GITHUB_WORKSPACE}/scripts/smoke/verify_human_approval.cjs" \
            /tmp/jacs-npm-smoke/node_modules/@hai.ai/jacs \
            "${GITHUB_WORKSPACE}/binding-core/tests/fixtures/human_approved_document_v1.json"
          python3 "${GITHUB_WORKSPACE}/scripts/check_native_crypto_linkage.py" \
            /tmp/jacs-npm-smoke/node_modules/@hai.ai/jacs/*.node
