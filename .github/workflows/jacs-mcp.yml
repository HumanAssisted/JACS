name: MCP Server (jacs-mcp)

on:
  workflow_call:
  push:
    branches: ["main"]
    paths:
      - "jacs-mcp/**"
      - "jacs/**"
      - "jacs-core/**"
      - "jacs-media/**"
      - "binding-core/**"
      - "jacs-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/jacs-mcp.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "jacs-mcp/**"
      - "jacs/**"
      - "jacs-core/**"
      - "jacs-media/**"
      - "binding-core/**"
      - "jacs-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/jacs-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-jacs-mcp:
    name: Test jacs-mcp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install system dependencies (D-Bus for keychain support)
        run: sudo apt-get update || echo 'apt-get update reported index errors (third-party runner sources); installing from the indexes that loaded'; sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-09
        with:
          toolchain: "1.97"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build jacs-cli (required by jacs-mcp integration tests)
        run: cargo build -p jacs-cli

      - name: Run jacs-mcp tests
        run: cargo test -p jacs-mcp --features full-tools --verbose
        env:
          JACS_KEYCHAIN_BACKEND: disabled
