name: Shipped artifact matrix

on:
  workflow_run:
    workflows:
      - "Release CLI Binaries"
      - "Release crates.io"
      - "Release @hai.ai/jacs-wasm"
      - "Release native npm"
      - "Release PyPI"
      - "Release jacsgo Native Libraries"
    types: [completed]
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:
    inputs:
      require_parity:
        description: "Fail unless Rust, CLI, Python, Go, native npm and WASM npm match source"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-public-registries:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Install pinned registry-provenance verifiers
        run: |
          set -euo pipefail
          python -m venv /tmp/jacs-registry-provenance
          /tmp/jacs-registry-provenance/bin/pip install "pypi-attestations==0.0.29"
          echo /tmp/jacs-registry-provenance/bin >> "$GITHUB_PATH"
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"
      - name: Verify observed registry matrix
        if: ${{ !inputs.require_parity }}
        run: ./scripts/check-release-matrix.py --online
      - name: Require coordinated release parity
        if: ${{ inputs.require_parity }}
        run: ./scripts/check-release-matrix.py --require-parity
      - name: Cryptographically reverify recorded GitHub release inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/verify_github_release_attestations.py
          --matrix release/shipped-artifacts.json
      - name: Cryptographically reverify recorded PyPI/npm releases
        run: >-
          python3 scripts/verify_recorded_registry_provenance.py
          release/shipped-artifacts.json
