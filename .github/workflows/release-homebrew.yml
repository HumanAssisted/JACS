name: Sync Homebrew Tap

on:
  push:
    tags:
      - 'crate/v*'
  workflow_dispatch:
    inputs:
      jacs_version:
        description: "JACS version for Formula/jacs.rb (defaults to tag or jacs/Cargo.toml)"
        required: false
      haisdk_version:
        description: "HAISDK version for Formula/haisdk.rb (defaults to latest on PyPI)"
        required: false
      haisdk_pypi_package:
        description: "PyPI package name for HAISDK"
        required: false
        default: "haisdk"
      tap_repository:
        description: "Homebrew tap repository (owner/repo)"
        required: false
        default: "HumanAssisted/homebrew-jacs"
      tap_branch:
        description: "Tap branch (stable branch is master)"
        required: false
        default: "master"

permissions:
  contents: read

jobs:
  security-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  sync-formulas:
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for tap token
        id: tap-token
        env:
          HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not configured; skipping Homebrew tap sync."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: steps.tap-token.outputs.available == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve versions and artifact checksums
        id: resolve
        if: steps.tap-token.outputs.available == 'true'
        env:
          JACS_VERSION_INPUT: ${{ github.event.inputs.jacs_version || '' }}
          HAISDK_VERSION_INPUT: ${{ github.event.inputs.haisdk_version || '' }}
          HAISDK_PYPI_PACKAGE_INPUT: ${{ github.event.inputs.haisdk_pypi_package || '' }}
          TAP_REPOSITORY_INPUT: ${{ github.event.inputs.tap_repository || '' }}
          TAP_BRANCH_INPUT: ${{ github.event.inputs.tap_branch || '' }}
        shell: bash
        run: python3 scripts/homebrew_release.py resolve

      - name: Generate formula files
        if: steps.tap-token.outputs.available == 'true'
        env:
          JACS_VERSION: ${{ steps.resolve.outputs.jacs_version }}
          JACS_SHA256: ${{ steps.resolve.outputs.jacs_sha256 }}
          HAISDK_SDIST_URL: ${{ steps.resolve.outputs.haisdk_sdist_url }}
          HAISDK_SHA256: ${{ steps.resolve.outputs.haisdk_sha256 }}
        shell: bash
        run: python3 scripts/homebrew_release.py render

      - name: Checkout Homebrew tap repository
        if: steps.tap-token.outputs.available == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: ${{ steps.resolve.outputs.tap_repository }}
          ref: ${{ steps.resolve.outputs.tap_branch }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false

      - name: Publish updated formulas to tap
        if: steps.tap-token.outputs.available == 'true'
        env:
          JACS_VERSION: ${{ steps.resolve.outputs.jacs_version }}
          HAISDK_VERSION: ${{ steps.resolve.outputs.haisdk_version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_BRANCH: ${{ steps.resolve.outputs.tap_branch }}
          TAP_REPOSITORY: ${{ steps.resolve.outputs.tap_repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp generated/Formula/jacs.rb tap/Formula/jacs.rb
          cp generated/Formula/haisdk.rb tap/Formula/haisdk.rb

          cd tap
          if git diff --quiet -- Formula/jacs.rb Formula/haisdk.rb; then
            echo "No Homebrew formula changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/jacs.rb Formula/haisdk.rb
          git commit -m "Update formulas: jacs v${JACS_VERSION}, haisdk v${HAISDK_VERSION}"

          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\\n" "$HOMEBREW_TAP_TOKEN" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://github.com/${TAP_REPOSITORY}.git" "HEAD:${TAP_BRANCH}"
