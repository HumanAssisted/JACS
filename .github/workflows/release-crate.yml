name: Release crates.io

on:
  push:
    tags:
      - 'crate/v*'

permissions:
  contents: read

concurrency:
  group: release-crate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  functional-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/rust.yml

  native-functional-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/native-bindings.yml

  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate and extract release tag
        id: extract
        run: python3 scripts/release_tag.py --surface crate

      - name: Validate every crate identity, version and publication dependency
        env:
          TAG_VERSION: ${{ steps.extract.outputs.version }}
        run: python3 scripts/rust_release.py validate --version "$TAG_VERSION"

  publish:
    needs: [security-gate, functional-gate, native-functional-gate, verify-version]
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.97.0"

      # Transitional fallback only: keep CRATES_IO_TOKEN until every crate has
      # a crates.io trusted publisher for this workflow and environment. Then
      # set CRATES_IO_TRUSTED_PUBLISHING_ENABLED=true and remove the secret.
      - name: Report CRATES_IO_TOKEN migration fallback
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED != 'true'
        run: echo "::warning::Trusted publishing is not enabled; using the CRATES_IO_TOKEN migration fallback"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install native crate build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev pkg-config libssl-dev libdbus-1-dev

      - name: Prepare the complete Rust release workspace
        run: python3 scripts/rust_release.py prepare --version "$VERSION"

      - name: Audit the combined source-pinned dependency closure
        run: |
          cargo install cargo-audit --locked --version 0.22.1
          # Same deadline- and reachability-checked SurrealDB exception as security.yml.
          # The required security-gate validates the exception before publication.
          cargo audit --file target/crate-release/source/Cargo.lock --ignore RUSTSEC-2023-0071

      - name: Build and compile-verify every pre-publish Rust candidate
        run: python3 scripts/rust_release.py package

      - name: Generate pre-publish Rust candidate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: target/crate-release/extracted
          format: spdx-json
          output-file: pre-publish-rust-candidates.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.46.0

      - name: Gate publish on complete Rust candidate evidence
        run: |
          set -euo pipefail
          jq -e '.spdxVersion | startswith("SPDX-2.")' pre-publish-rust-candidates.spdx.json >/dev/null
          jq -e '((.packages // []) | length) > 0' pre-publish-rust-candidates.spdx.json >/dev/null
          (cd target/crate-release/archives && sha256sum -c ../sha256sums.txt)

      - name: Authenticate jacs-core publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_core
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-core to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_core.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-core

      - name: Authenticate jacs-media publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_media
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-media to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_media.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-media

      - name: Authenticate jacs publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs

      - name: Authenticate jacs-binding-core publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_binding_core
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-binding-core to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_binding_core.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-binding-core

      - name: Authenticate jacs-mcp publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_mcp
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-mcp to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_mcp.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-mcp

      - name: Authenticate jacs-cli publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_cli
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-cli to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_cli.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-cli

      - name: Authenticate jacs-mcp-compat publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_mcp_compat
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-mcp-compat to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_mcp_compat.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-mcp-compat

      - name: Authenticate jacs-cli-compat publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_cli_compat
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-cli-compat to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_cli_compat.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-cli-compat

      - name: Authenticate jacs-wasm publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_wasm
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-wasm to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_wasm.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-wasm

      - name: Authenticate jacs-mobile publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_mobile
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-mobile to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_mobile.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-mobile

      - name: Authenticate jacsnpm publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacsnpm
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacsnpm to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacsnpm.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacsnpm

      - name: Authenticate jacspy publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacspy
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacspy to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacspy.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacspy

      - name: Authenticate jacsgo publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacsgo
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacsgo to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacsgo.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacsgo

      - name: Authenticate jacs-duckdb publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_duckdb
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-duckdb to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_duckdb.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-duckdb

      - name: Authenticate jacs-postgresql publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_postgresql
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-postgresql to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_postgresql.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-postgresql

      - name: Authenticate jacs-redb publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_redb
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-redb to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_redb.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-redb

      - name: Authenticate jacs-surrealdb publish via crates.io OIDC
        if: vars.CRATES_IO_TRUSTED_PUBLISHING_ENABLED == 'true'
        id: auth_jacs_surrealdb
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Verify and publish jacs-surrealdb to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth_jacs_surrealdb.outputs.token || secrets.CRATES_IO_TOKEN }}
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: python3 scripts/rust_release.py publish-one --crate jacs-surrealdb

      - name: Preserve exact registry-verified Rust candidates
        run: |
          set -euo pipefail
          mkdir -p packaged-crates
          cp -R target/crate-release/archives packaged-crates/
          cp -R target/crate-release/extracted packaged-crates/
          cp target/crate-release/sha256sums.txt "jacs-rust-${VERSION}-sha256sums.txt"
          cp target/crate-release/candidate.json packaged-crates/source.json

      - name: Generate packaged Rust-crate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: packaged-crates/extracted
          format: spdx-json
          output-file: jacs-rust-packages.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.46.0

      - name: Validate packaged Rust-crate SPDX SBOM
        run: jq -e '.spdxVersion | startswith("SPDX-2.")' jacs-rust-packages.spdx.json >/dev/null && jq -e '((.packages // []) | length) > 0' jacs-rust-packages.spdx.json >/dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacs-rust-${{ needs.verify-version.outputs.version }}-release-evidence
          path: |
            packaged-crates/archives/*.crate
            jacs-rust-${{ needs.verify-version.outputs.version }}-sha256sums.txt
            jacs-rust-packages.spdx.json
            pre-publish-rust-candidates.spdx.json
          if-no-files-found: error

      - name: Wait for jacs-cli and smoke a clean registry consumer
        run: |
          set -euo pipefail
          python3 scripts/crates_release_gate.py wait --crate jacs-cli --version "$VERSION"
          rm -rf /tmp/jacs-rust-release-smoke
          cargo new --bin /tmp/jacs-rust-release-smoke
          cd /tmp/jacs-rust-release-smoke
          cargo add "jacs-core@=$VERSION" serde_json
          # Run the checked-in core PQ quickstart in a clean registry consumer.
          cp "$GITHUB_WORKSPACE/jacs-core/examples/portable_quickstart.rs" src/main.rs
          cargo run --locked

  durable-release-evidence:
    needs: [verify-version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacs-rust-${{ needs.verify-version.outputs.version }}-release-evidence
          path: release-evidence

      - name: Attest durable Rust release evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-evidence/jacs-rust-${{ needs.verify-version.outputs.version }}-sha256sums.txt
            release-evidence/jacs-rust-packages.spdx.json
            release-evidence/pre-publish-rust-candidates.spdx.json

      - name: Publish durable Rust release evidence
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: JACS Rust crates v${{ needs.verify-version.outputs.version }}
          body: Attested candidate checksums and SPDX SBOMs for the crates.io release.
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-evidence/jacs-rust-${{ needs.verify-version.outputs.version }}-sha256sums.txt
            release-evidence/jacs-rust-packages.spdx.json
            release-evidence/pre-publish-rust-candidates.spdx.json
