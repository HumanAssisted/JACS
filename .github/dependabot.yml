version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-security-and-maintenance:
        patterns: ["*"]
  # Archived Rust locks remain audited while native SDK compatibility is used.
  - package-ecosystem: cargo
    directory: "/archive/native"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/archive/native/jacs-surrealdb"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/archive/native/jacs/examples/observability"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/jacs-wasm/examples/vite-smoke"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
